name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - 'twrp-12.1'
          - 'twrp-14.1'
          - 'twrp-14'
      version_tag:
        description: 'Custom Version Tag (leave empty for auto date)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Release Classification'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - 'pre-release'
          - 'release'
          - 'test-build'
      publish_release:
        description: 'Publish as GitHub Release (uncheck for artifact-only)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Cleanup Runner Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/realme/RMX5079

    - name: Setup Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2 libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 rsync bc ccache \
          schedtool lzop libssl-dev openjdk-11-jdk
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync TWRP Manifest
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        git config --global http.postBuffer 1048576000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

        BRANCH="${{ github.event.inputs.twrp_branch }}"
        echo "Using TWRP branch: $BRANCH"
        echo "TWRP_BRANCH=$BRANCH" >> $GITHUB_ENV

        repo init --depth=1 --no-repo-verify -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH

        echo "=== Syncing TWRP Sources with Auto-Retry ==="
        SYNC_SUCCESS=0
        for ATTEMPT in 1 2 3 4 5; do
          echo ">>> repo sync attempt $ATTEMPT of 5..."
          if [ $ATTEMPT -eq 1 ]; then
            JOBS=$(nproc --all)
          elif [ $ATTEMPT -eq 2 ]; then
            JOBS=4
            sleep 15
          elif [ $ATTEMPT -eq 3 ]; then
            JOBS=2
            sleep 30
          else
            JOBS=1
            sleep 45
          fi

          if repo sync -c -j$JOBS --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune; then
            echo ">>> repo sync succeeded on attempt $ATTEMPT!"
            SYNC_SUCCESS=1
            break
          else
            echo ">>> repo sync attempt $ATTEMPT failed, retrying..."
          fi
        done

        if [ $SYNC_SUCCESS -ne 1 ]; then
          echo "ERROR: repo sync failed after 5 attempts!"
          exit 1
        fi

    - name: Copy Device Tree to Manifest
      run: |
        mkdir -p ~/twrp/device/realme
        cp -r device/realme/RMX5079 ~/twrp/device/realme/

    - name: Build TWRP Recovery
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh

        BRANCH="${TWRP_BRANCH:-twrp-12.1}"
        echo "=== Lunching Target (Branch: $BRANCH) ==="
        if [ "$BRANCH" = "twrp-14" ] || [ "$BRANCH" = "twrp-14.1" ]; then
          export TARGET_RELEASE=ap2a
          if [ ! -d build/release ]; then
            echo "build/release not found in manifest; cloning AOSP build/release..."
            git clone --depth=1 -b android-14.0.0_r67 https://android.googlesource.com/platform/build/release build/release || true
          fi
          if [ -f build/make/core/release_config.mk ]; then
            sed -i 's/\$(error No release config found for TARGET_RELEASE/\$(warning No release config found for TARGET_RELEASE/g' build/make/core/release_config.mk
          fi
          lunch twrp_RMX5079-ap2a-eng || lunch twrp_RMX5079-ap2a-userdebug || lunch twrp_RMX5079-trunk_staging-eng || lunch omni_RMX5079-ap2a-eng || lunch twrp_RMX5079-eng || lunch omni_RMX5079-eng
        else
          lunch twrp_RMX5079-eng || lunch twrp_RMX5079-userdebug || lunch omni_RMX5079-eng
        fi

        echo "=== Pre-populating DTB image ==="
        mkdir -p out/target/product/RMX5079
        cp -vf device/realme/RMX5079/prebuilt/dtb out/target/product/RMX5079/dtb.img || true
        cp -vf device/realme/RMX5079/prebuilt/dtb out/target/product/RMX5079/dtb || true

        echo "=== Fixing rsync conflict in build/make/core/Makefile ==="
        sed -i 's/rsync -a --exclude=sdcard/rsync -a --exclude=vendor --exclude=sdcard/g' build/make/core/Makefile || true

        echo "=== Building Recovery Image ==="
        make recoveryimage -j$(nproc --all)

        echo "=== Collecting Output Recovery Image ==="
        mkdir -p $GITHUB_WORKSPACE/output
        if [ -f out/target/product/RMX5079/recovery.img ]; then
          echo "Found recovery.img!"
          cp -vf out/target/product/RMX5079/recovery.img $GITHUB_WORKSPACE/output/
        else
          echo "Looking for recovery image in out/target/product/..."
          find out/target/product/ -name "recovery.img" -exec cp -vf {} $GITHUB_WORKSPACE/output/ \;
        fi

        if [ ! -f $GITHUB_WORKSPACE/output/recovery.img ]; then
          echo "ERROR: recovery.img was not generated by make recoveryimage!"
          exit 1
        fi

        echo "=== Output Files in Workspace ==="
        ls -la $GITHUB_WORKSPACE/output/

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-RMX5079-${{ github.event.inputs.twrp_branch }}
        path: output/*
        if-no-files-found: warn

    - name: Process Checksums & Release Metadata
      id: release_info
      run: |
        cd $GITHUB_WORKSPACE/output
        sha256sum *.img > sha256.txt || true

        CUSTOM_TAG="${{ github.event.inputs.version_tag }}"
        if [ -n "$CUSTOM_TAG" ]; then
          TAG="$CUSTOM_TAG"
        else
          TAG="v$(date +'%Y.%m.%d-%H%M')-twrp"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

        PRERELEASE=false
        if [ "${{ github.event.inputs.release_type }}" != "release" ]; then
          PRERELEASE=true
        fi
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: TWRP Recovery ${{ steps.release_info.outputs.tag }} (${{ steps.release_info.outputs.date }})
        draft: false
        prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
        body: |
          ## 📱 TWRP Recovery for Realme (RMX5079)

          **Target Device:** Realme P3 5G / RMX5079 / RMX5070 (Qualcomm Snapdragon 6 Gen 4 SM6650 / volcano)
          **Manifest Branch:** ${{ github.event.inputs.twrp_branch }}
          **Release Classification:** ${{ github.event.inputs.release_type }}
          **Build Date:** ${{ steps.release_info.outputs.date }}

          ---
          ### 📦 File & Checksum:
          Lihat file `sha256.txt` untuk memastikan keutuhan file hasil download.

          ---
          ### 🚀 Panduan Penggunaan (Booting):
          > ⚠️ **PERINGATAN**: Gunakan perintah `fastboot boot` (JANGAN `fastboot flash`) untuk testing guna mencegah bootloop/softbrick!
          ```bash
          adb reboot bootloader
          fastboot boot recovery.img
          ```
        files: |
          output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
