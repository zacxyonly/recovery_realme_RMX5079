name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      fox_branch:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
      version_tag:
        description: 'Custom Version Tag (leave empty for auto date)'
        required: false
        default: ''
        type: string
      release_type:
        description: 'Release Classification'
        required: true
        default: 'pre-release'
        type: choice
        options:
          - 'pre-release'
          - 'release'
          - 'test-build'
      publish_release:
        description: 'Publish as GitHub Release (uncheck for artifact-only)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Cleanup Runner Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: orangefox
        path: device/realme/RMX5079

    - name: Setup Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2 libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 rsync bc ccache \
          schedtool lzop libssl-dev openjdk-11-jdk patch
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync OrangeFox Environment
      run: |
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        git config --global http.postBuffer 1048576000
        git config --global http.lowSpeedLimit 1000
        git config --global http.lowSpeedTime 60

        BRANCH="${{ github.event.inputs.fox_branch }}"
        echo "Using OrangeFox branch: $BRANCH"
        echo "FOX_BRANCH=$BRANCH" >> $GITHUB_ENV

        echo "=== Cloning Official OrangeFox Sync Tool ==="
        git clone https://gitlab.com/orangefox/sync.git ~/orangefox_sync
        cd ~/orangefox_sync
        ./orangefox_sync.sh --branch "$BRANCH" --path "$HOME/fox"

    - name: Copy Device Tree to Manifest
      run: |
        mkdir -p ~/fox/device/realme
        cp -r device/realme/RMX5079 ~/fox/device/realme/
        echo "=== Device Tree Contents in Manifest ==="
        ls -la ~/fox/device/realme/RMX5079/

    - name: Build OrangeFox Recovery
      run: |
        cd ~/fox
        export LC_ALL="C"
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export FOX_BUILD_DEVICE="RMX5079"
        export FOX_BUILD_TYPE="Unofficial"

        # Prevent OrangeFox patched envsetup.sh test from returning non-zero in bash -e
        mkdir -p ~/fox/frameworks/base/services/core/xsd/vts
        touch ~/fox/frameworks/base/services/core/xsd/vts/Android.mk

        set +e
        source build/envsetup.sh
        echo "=== Lunching Target (fox_12.1) ==="
        lunch twrp_RMX5079-eng || lunch twrp_RMX5079-userdebug || lunch omni_RMX5079-eng
        LUNCH_EXIT=$?
        set -e
        if [ $LUNCH_EXIT -ne 0 ]; then
          echo "ERROR: Lunch target failed!"
          exit 1
        fi

        echo "=== Pre-populating DTB image ==="
        mkdir -p out/target/product/RMX5079
        cp -vf device/realme/RMX5079/prebuilt/dtb out/target/product/RMX5079/dtb.img || true
        cp -vf device/realme/RMX5079/prebuilt/dtb out/target/product/RMX5079/dtb || true

        echo "=== Fixing rsync conflict in build/make/core/Makefile ==="
        sed -i 's/rsync -a --exclude=sdcard/rsync -a --exclude=vendor --exclude=sdcard/g' build/make/core/Makefile || true

        echo "=== Building Recovery Image ==="
        make recoveryimage -j$(nproc --all)

        echo "=== Collecting Output Recovery Files ==="
        mkdir -p $GITHUB_WORKSPACE/output
        find out/target/product/ -name "recovery.img" -exec cp -vf {} $GITHUB_WORKSPACE/output/ \; || true
        find out/target/product/ -name "OrangeFox*.zip" -exec cp -vf {} $GITHUB_WORKSPACE/output/ \; || true
        find out/target/product/ -name "OrangeFox*.img" -exec cp -vf {} $GITHUB_WORKSPACE/output/ \; || true

        if [ ! -f $GITHUB_WORKSPACE/output/recovery.img ]; then
          echo "ERROR: recovery.img was not generated!"
          exit 1
        fi

        echo "=== Output Files in Workspace ==="
        ls -la $GITHUB_WORKSPACE/output/

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-RMX5079-${{ github.event.inputs.fox_branch }}
        path: output/*
        if-no-files-found: warn

    - name: Process Checksums & Release Metadata
      id: release_info
      run: |
        cd $GITHUB_WORKSPACE/output
        sha256sum * > sha256.txt || true

        CUSTOM_TAG="${{ github.event.inputs.version_tag }}"
        if [ -n "$CUSTOM_TAG" ]; then
          TAG="$CUSTOM_TAG"
        else
          TAG="v$(date +'%Y.%m.%d-%H%M')-fox"
        fi

        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

        PRERELEASE=false
        if [ "${{ github.event.inputs.release_type }}" != "release" ]; then
          PRERELEASE=true
        fi
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      if: ${{ github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag }}
        name: OrangeFox Recovery ${{ steps.release_info.outputs.tag }} (${{ steps.release_info.outputs.date }})
        draft: false
        prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
        body: |
          # OrangeFox Recovery for Realme P3 5G (dongfeng)

          Automated build for **Realme P3 5G (`RMX5079`, codename: `dongfeng`)**.

          ---

          ### 📱 Build Information
          | Attribute | Detail |
          |:---|:---|
          | **Device** | Realme P3 5G (`RMX5079` / `dongfeng`) |
          | **SoC** | Qualcomm Snapdragon 6 Gen 4 (`SM6650`) |
          | **OrangeFox Base** | `${{ github.event.inputs.fox_branch }}` |
          | **Classification** | `${{ github.event.inputs.release_type }}` |
          | **Build Date** | `${{ steps.release_info.outputs.date }}` |

          ---

          ### 🚀 Boot Instructions (Testing)
          > [!IMPORTANT]
          > Always boot temporarily via fastboot before flashing directly:

          ```bash
          adb reboot bootloader
          fastboot boot recovery.img
          ```

          ---

          ### 📦 Verification
          Verify file integrity before booting:
          - Refer to `sha256.txt` included in the release assets.
        files: |
          output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
